services:
  postgres:
    image: postgres:15-alpine
    container_name: tanbox_postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-tanbox_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tanbox_pass_2026}"
      POSTGRES_DB: "${POSTGRES_DB:-tanbox_db}"
    command: postgres -c log_min_duration_statement=500 -c log_statement=ddl
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tanbox_user} -d ${POSTGRES_DB:-tanbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - tanbox_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tanbox_backend
    restart: always
    environment:
      PORT: 5050
      DATABASE_URL: "${DATABASE_URL:-postgresql://tanbox_user:tanbox_pass_2026@postgres:5432/tanbox_db?schema=public}"
      JWT_SECRET: "${JWT_SECRET:-tanbox_kz_jwt_secret_key_super_secure_2026}"
      NODE_ENV: production
      LABEL_GENERATOR_HOST: label-generator
      LABEL_GENERATOR_PORT: 5060
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LEADS_CHAT_ID: ${TELEGRAM_LEADS_CHAT_ID:-}
      TELEGRAM_ALERTS_CHAT_ID: ${TELEGRAM_ALERTS_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tanbox_uploads:/app/uploads
      - tanbox_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tanbox_net

  frontend-landing:
    build:
      context: ./frontend-landing
      dockerfile: Dockerfile
    container_name: tanbox_frontend_landing
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - tanbox_net

  frontend-lk:
    build:
      context: .
      dockerfile: ./frontend-lk/Dockerfile
    container_name: tanbox_frontend_lk
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - tanbox_net

  frontend-admin:
    build:
      context: .
      dockerfile: ./frontend-admin/Dockerfile
    container_name: tanbox_frontend_admin
    restart: always
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      - tanbox_net

  label-generator:
    build:
      context: ./label-generator
      dockerfile: Dockerfile
    container_name: tanbox_label_generator
    restart: always
    environment:
      PORT: 5060
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - tanbox_net

  caddy:
    image: caddy:2-alpine
    container_name: tanbox_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend-landing
      - frontend-lk
      - frontend-admin
      - backend
      - label-generator
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tanbox_net

volumes:
  pgdata:
  tanbox_uploads:
  tanbox_logs:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  tanbox_net:
    name: tanbox_default
    external: true
