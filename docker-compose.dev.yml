services:
  postgres:
    image: postgres:15-alpine
    container_name: tanbox_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tanbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tanbox_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tanbox_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tanbox_user} -d ${POSTGRES_DB:-tanbox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: tanbox_backend_dev
    restart: always
    ports:
      - "5050:5050"
    environment:
      PORT: ${PORT:-5050}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tanbox_user:tanbox_pass_2026@postgres:5432/tanbox_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-dev_only_local_secret_please_change_in_env_file}
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      LABEL_GENERATOR_HOST: label-generator
      LABEL_GENERATOR_PORT: 5060
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LEADS_CHAT_ID: ${TELEGRAM_LEADS_CHAT_ID:-}
      TELEGRAM_ALERTS_CHAT_ID: ${TELEGRAM_ALERTS_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules_dev:/app/node_modules
      - tanbox_uploads_dev:/app/uploads
      - tanbox_logs_dev:/app/logs

  frontend-landing:
    build:
      context: ./frontend-landing
      dockerfile: Dockerfile.dev
    container_name: tanbox_frontend_landing_dev
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - NODE_OPTIONS=--max-old-space-size=512
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend-landing:/app
      - landing_node_modules_dev:/app/node_modules

  frontend-lk:
    build:
      context: .
      dockerfile: ./frontend-lk/Dockerfile.dev
    container_name: tanbox_frontend_lk_dev
    restart: always
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=/api
      - NODE_OPTIONS=--max-old-space-size=512
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend-lk:/app
      - ./shared:/shared
      - lk_node_modules_dev:/app/node_modules

  frontend-admin:
    build:
      context: .
      dockerfile: ./frontend-admin/Dockerfile.dev
    container_name: tanbox_frontend_admin_dev
    restart: always
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=/api
      - NODE_OPTIONS=--max-old-space-size=512
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend-admin:/app
      - ./shared:/shared
      - admin_node_modules_dev:/app/node_modules

  label-generator:
    build:
      context: ./label-generator
      dockerfile: Dockerfile.dev
    container_name: tanbox_label_generator_dev
    restart: always
    ports:
      - "5060:5060"
    environment:
      PORT: 5060
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=512"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./label-generator:/app
      - label_generator_node_modules_dev:/app/node_modules

  caddy:
    image: caddy:2-alpine
    container_name: tanbox_caddy_dev
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    depends_on:
      - frontend-landing
      - frontend-lk
      - frontend-admin
      - backend
      - label-generator

volumes:
  pgdata_dev:
  backend_node_modules_dev:
  landing_node_modules_dev:
  lk_node_modules_dev:
  admin_node_modules_dev:
  label_generator_node_modules_dev:
  tanbox_uploads_dev:
  tanbox_logs_dev:
  caddy_data_dev:
  caddy_config_dev:
