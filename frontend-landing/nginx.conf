map $request_uri $landing_not_found {
    default /404.html;
    ~^/kz(?:/|\?|$) /kz/404.html;
    ~^/en(?:/|\?|$) /en/404.html;
}

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    error_page 404 $landing_not_found;

    # Match the original request so internal index/error-page rewrites do not loop.
    if ($request_uri ~ "^/index\.html?(?:\?.*)?$") {
        return 301 /$is_args$args;
    }
    if ($request_uri ~ "^(?<index_directory>/[^/][^?]*)/index\.html?(?:\?.*)?$") {
        return 301 $index_directory$is_args$args;
    }
    if ($uri ~ "^(?<path_without_slash>.+)/$") {
        return 301 $path_without_slash$is_args$args;
    }

    location /api/ {
        proxy_pass http://backend:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    location = /404.html {
        internal;
    }

    location = /kz/404.html {
        internal;
    }

    location = /en/404.html {
        internal;
    }

    location = /favicon.ico {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|webm|mp4|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
